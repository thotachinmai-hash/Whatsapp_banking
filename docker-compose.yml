services:

  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: whatsapp_postgres
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for session memory
  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Application
  app:
    build: .
    container_name: whatsapp_app
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://banking_user:banking_pass@postgres:5432/banking_db
      REDIS_URL: redis://redis:6379
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      SARVAM_STT: ${SARVAM_STT:-saaras:v3}
      SARVAM_TTS: ${SARVAM_TTS:-bulbul:v3}
      SARVAM_MODEL_FAST: ${SARVAM_MODEL_FAST:-sarvam-105b-conversations}
      SARVAM_MODEL_REASONING: ${SARVAM_MODEL_REASONING:-sarvam-105b}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID}
      VERIFY_TOKEN: ${VERIFY_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

